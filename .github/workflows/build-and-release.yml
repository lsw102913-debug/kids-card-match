name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Build
        run: (cd build/web && zip -r ../../kids-card-match-web.zip .)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: kids-card-match-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kids Card Match ${{ github.ref_name }} (클리어 시간 순위표 & 해린이 음성 복원 & 20장 안정화)"
          body: |
            ## 🎨 아기자기 같은 그림 찾기 안드로이드 앱 (${{ github.ref_name }})

            해린이와 함께 더욱 몰입감 있게 즐길 수 있는 **클리어 시간 순위표(명예의 전당)** 및 안정성 업데이트가 적용되었습니다!

            ### 🚀 주요 업데이트 내역
            - 🏆 **난이도(카드 장수)별 클리어 시간 Top 5 순위표**:
              - 4장(새싹), 6장(꽃잎), 12장(나무), 16장(무지개), 20장(우주) 각 모드별로 가장 빠른 시간 순으로 1위~5위 기록 보관!
              - 게임 클리어 시 1~5등 안이면 **"✨ 해린이 이번 기록!"** 으로 화려하게 축하!
              - 순위권 밖(6위 이하)인 경우에도 **"📍 이번 기록: OO초 (순위권 밖: 6위)"** 및 **"5등까지 OO초 남았어요! 다음엔 5등 도전! 💪"** 문구로 따뜻한 피드백 제공!
              - 상단 바의 **🏆 트로피 아이콘**을 눌러 언제든 난이도별 순위표 열람 가능!
            - ⏱️ **실시간 플레이 타이머 탑재**: 첫 카드 터치 시 작동하여 상단 바에서 경과 시간 실시간 확인 가능
            - 👧 **모든 상황에서 "해린" 이름 부르기**: 카드를 맞추거나 틀릴 때 언제나 "해린아", "해린이"를 다정하게 부르는 맞춤 보이스 제공
            - ⚡ **경쾌한 말하기 속도 복원**: 이전 버전의 활기차고 귀에 쏙쏙 들어오는 속도(0.51x)로 복원하여 지루함 없이 플레이
            - 🛡️ **20장 우주 모드 회색 화면 버그 완벽 수정**:
              - 안드로이드 시스템 레벨 가로 방향(sensorLandscape) 고정 적용
              - 긴 글자("아기공룡알", "공룡발자국" 등) 자동 스케일 다운으로 카드 영역 넘침 방지
              - 3D 카드 회전 애니메이션 곡선 정밀화 및 전역 에러 리커버리 보호막 탑재

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰/태블릿에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            kids-card-match-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



