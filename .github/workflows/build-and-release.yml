name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Build
        run: (cd build/web && zip -r ../../kids-card-match-web.zip .)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: kids-card-match-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kids Card Match ${{ github.ref_name }} (음성 읽어주기 & 화면 비율 최적화)"
          body: |
            ## 🎨 아기자기 같은 그림 찾기 안드로이드 앱 (${{ github.ref_name }})

            사용자 피드백을 적극 반영하여 음성 지원 및 화면 비율 최적화 업데이트가 적용되었습니다!

            ### 🚀 주요 업데이트 내역
            - 🔊 **신나는 한글 음성(TTS) 읽어주기 탑재**: 짝을 맞출 때마다 "티라노!", "아기곰!", "딸기!" 등을 신나고 또렷하게 읽어주는 생생한 음성 피드백!
            - 📐 **화면 비율 완벽 적응 (Zero-Clipping)**: 4장부터 20장까지 어떤 스마트폰이나 태블릿에서도 카드가 아래로 잘리지 않고 100% 한 화면에 쏙 들어가도록 동적 비율 계산 적용!
            - 🖼️ **카드 일러스트 크기 2차 대폭 확대**: 카드 면적의 90% 이상을 일러스트가 시원하게 차지하도록 레이아웃 재설계!
            - 🦖 **쿵쾅 공룡 테마**: 티라노, 브라키오, 트리케라 등 인기 공룡 10종 지원!
            - 🎆 **초호화 듀얼 폭죽 & 칭찬 배너**: 짝을 맞출 때마다 양쪽 대포에서 터지는 화려한 불꽃놀이

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰/태블릿에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            kids-card-match-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


