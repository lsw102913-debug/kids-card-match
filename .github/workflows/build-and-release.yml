name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Build
        run: (cd build/web && zip -r ../../kids-card-match-web.zip .)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: kids-card-match-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kids Card Match ${{ github.ref_name }} (가로모드 & 공룡 테마 대규모 업데이트)"
          body: |
            ## 🎨 아기자기 같은 그림 찾기 안드로이드 앱 (${{ github.ref_name }})

            4~5세 아이가 더욱 신나게 즐길 수 있도록 대규모 업데이트가 적용되었습니다!

            ### 🚀 주요 업데이트 내역
            - 🦖 **신규 공룡 테마 추가**: 티라노, 브라키오, 트리케라, 프테라, 스테고 등 인기 공룡 총출동!
            - 🖼️ **일러스트 크기 극대화**: 카드를 가득 채우는 시원시원하고 큼직한 귀여운 그림
            - 📱 **시원한 가로 모드 (Landscape) 전면 개편**: 탁 트인 화면에서 두 손으로 편안하게 플레이
            - 🎮 **16장(무지개) & 20장(우주) 모드 추가**: 기존 4, 6, 12장에 이어 16장, 20장 모드 지원!
            - 🎆 **초호화 듀얼 폭죽 & 칭찬 배너**: 짝을 맞출 때마다 양쪽 대포에서 터지는 화려한 불꽃놀이

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰/태블릿에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            kids-card-match-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

