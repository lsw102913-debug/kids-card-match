name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Build
        run: (cd build/web && zip -r ../../kids-card-match-web.zip .)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: kids-card-match-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kids Card Match ${{ github.ref_name }} (터치 효과음 & 해린이 음성 업데이트)"
          body: |
            ## 🎨 아기자기 같은 그림 찾기 안드로이드 앱 (${{ github.ref_name }})

            아이와 함께 더욱 즐겁게 플레이할 수 있는 음성 & 사운드 업데이트가 적용되었습니다!

            ### 🚀 주요 업데이트 내역
            - 🎵 **카드 선택 시 통통 튀는 효과음**: 카드를 누를 때마다 귀엽고 경쾌한 버블 팝 효과음과 햅틱 터치 반응!
            - 😜 **해린이 맞춤 유쾌한 음성**: 다른 그림을 선택했을 때 재밌는 톤으로 **"해린아 이건 아닌데??"** 하고 말해주는 피드백 보이스!
            - 👏 **신나는 칭찬 보이스**: 짝을 맞추면 "해린아 OO 맞았어!", 게임을 클리어하면 "우와 해린이 최고!" 응원 음성!
            - 📐 **화면 비율 완벽 적응**: 4장부터 20장까지 어떤 기기에서도 잘림 없는 제로 클리핑(Zero-Clipping) 화면!
            - 🖼️ **화면 가득 대형 일러스트**: 카드 속 그림을 큼직하고 시원하게 배치!

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰/태블릿에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            kids-card-match-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



