name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Automated Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Build
        run: (cd build/web && zip -r ../../kids-card-match-web.zip .)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-zip
          path: kids-card-match-web.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Kids Card Match ${{ github.ref_name }} (감정 풍부 음성 & 다양한 표현 업데이트)"
          body: |
            ## 🎨 아기자기 같은 그림 찾기 안드로이드 앱 (${{ github.ref_name }})

            해린이를 위한 더 따뜻하고 풍부한 감정의 음성과 다양한 피드백 표현이 추가되었습니다!

            ### 🚀 주요 업데이트 내역
            - 🎙️ **감정 가득 다양한 피드백 표현**:
              - 틀렸을 때: "해린아, 이건 아닌데?? 헤헤", "어라? 다른 친구네~ 다시 찾아보자!", "앗, 아쉬워라! 다른 그림이야~" 등 지루하지 않게 다양한 재밌는 톤으로 안내
              - 맞췄을 때: "우와! 해린아, OO 찾았다!", "딩동댕! OO 짝꿍 맞았네!", "정답! 해린이 기억력 최고야!" 등 특급 칭찬 보이스
            - 🐢 **아이 눈높이 맞춤 차분한 말하기 속도**: 4~5세 아이가 정확하고 편안하게 알아들을 수 있도록 말하기 속도를 조절(0.42x)하고 자연스러운 호흡 추가
            - 💬 **화면 토스트 배너 연동**: 나오는 말소리와 화면에 뜨는 텍스트 배너가 100% 동일하게 일치되어 시각/청각 동시 학습 효과
            - 🎵 **카드 터치 통통 버블 효과음**: 카드를 터치할 때마다 통통 튀는 경쾌한 사운드 및 햅틱 진동
            - 📐 **가로모드 제로 클리핑**: 어떤 크기의 스마트폰/태블릿에서도 잘림 없이 큼직한 카드 표시

            ### 📲 다운로드 및 설치
            - 아래 **`app-release.apk`** 파일을 스마트폰/태블릿에서 다운로드하여 바로 설치하실 수 있습니다.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            kids-card-match-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



